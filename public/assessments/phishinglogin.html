<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script>
  // 🔹 Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyC6ReZ9JiKAhVwXLUwgzRRsk2Daw3pRli8",
    authDomain: "daysmadesimple-admin.firebaseapp.com",
    projectId: "daysmadesimple-admin",
    storageBucket: "daysmadesimple-admin.firebasestorage.app",
    messagingSenderId: "165327565681",
    appId: "1:165327565681:web:e28364ebb3cb1d9a683cd0"
  };

  // 🔹 Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const DASHBOARD_URL = "/assessments/phishingalert.html"; // <-- change if needed

  // 🔹 Redirect when authenticated (covers refresh + all login types)
  auth.onAuthStateChanged(user => {
    if (user) {
      window.location.replace(DASHBOARD_URL);
    }
  });

  // 🔹 Password login
  function loginUser() {
    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!password) {
      alert("Password empty! Use 'Sign in with Email' for passwordless login.");
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .catch(err => alert("❌ " + err.message));
  }

  // 🔹 Send magic email link
  function sendSignInLink() {
    const email = document.getElementById("username").value.trim();
    if (!email) {
      alert("Enter your email first.");
      return;
    }

    const actionCodeSettings = {
      url: window.location.origin,
      handleCodeInApp: true
    };

    auth.sendSignInLinkToEmail(email, actionCodeSettings)
      .then(() => {
        window.localStorage.setItem("emailForSignIn", email);
        alert("✅ Sign-in link sent! Check your email.");
      })
      .catch(err => alert("❌ " + err.message));
  }

  // 🔹 Complete magic-link sign-in
  if (auth.isSignInWithEmailLink(window.location.href)) {
    let email = window.localStorage.getItem("emailForSignIn");

    if (!email) {
      email = window.prompt("Please confirm your email to complete sign-in:");
    }

    auth.signInWithEmailLink(email, window.location.href)
      .then(() => {
        window.localStorage.removeItem("emailForSignIn");
      })
      .catch(err => alert("❌ " + err.message));
  }
</script>
